<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanks Game</title>
    <link rel="shortcut icon" href="./assets/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="./styles.css">
</head>

<body id="body">
    <main id="main">
        <canvas id="gameCanvas"></canvas>
        <section class="mobile-controls" aria-label="Controles táctiles">
            <div class="direction-controls">
                <button class="control-button control-up" data-control="up" type="button" aria-label="Avanzar">↑</button>
                <button class="control-button control-left" data-control="left" type="button" aria-label="Girar a la izquierda">↶</button>
                <button class="control-button control-down" data-control="down" type="button" aria-label="Retroceder">↓</button>
                <button class="control-button control-right" data-control="right" type="button" aria-label="Girar a la derecha">↷</button>
            </div>

            <div class="action-controls">
                <button class="control-button" data-control="select" type="button">SELECT</button>
                <button class="control-button" data-control="back" type="button">BACK</button>
            </div>
        </section>
        <section id="DebugPanel"></section>

    </main>

</body>
<script type="module" src="./main.js"></script>

</html>
